name: Flutter CI and Releases

on:
  push:
    branches: [master, main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test --concurrency=1

  build-linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Pack Linux artifact
        run: |
          mkdir -p artifacts
          tar -C build/linux/x64/release/bundle -czf artifacts/uasdraw-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: uasdraw-linux-x64
          path: artifacts/uasdraw-linux-x64.tar.gz

  build-android:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (optional)
        run: flutter build appbundle --release

      - name: Prepare Android artifacts
        run: |
          mkdir -p artifacts/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/android/uasdraw-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/android/uasdraw-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/android/uasdraw-x86_64-release.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/android/uasdraw-release.aab 2>/dev/null || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uasdraw-android
          path: artifacts/android/*

  release:
    needs: [test, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: uasdraw-linux-x64
          path: dist

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: uasdraw-android
          path: dist/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/uasdraw-linux-x64.tar.gz
            dist/android/uasdraw-arm64-v8a-release.apk
            dist/android/uasdraw-armeabi-v7a-release.apk
            dist/android/uasdraw-x86_64-release.apk
            dist/android/uasdraw-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
